name: Deploy to GitHub Pages

# Solo manuale, dalla scheda Actions del repo.
#
# L'indirizzo pubblico del sito e' quello su Vercel
# (https://krea-agency-psi.vercel.app), aggiornato in automatico dal push.
# Con questo workflow legato al push circolavano due indirizzi diversi dello
# stesso sito, con il rischio di mandarne in giro uno e aggiornare l'altro.
# Il workflow resta qui perche' Pages e' una riserva utile se Vercel e' giu'.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
